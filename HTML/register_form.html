<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Register Form</title>
        <style>
            header{
                background-color: black;
                color: white;
                text-align: center;
                padding: 20px;
            }
            label{
                text-align: center;
            }
            table, th, td{
                border: 1px solid black;
                padding: 10px;
                margin: 50px;
                margin-left: 1px;
                text-align: center;
                border-collapse: collapse;
            }
        </style>
        </head>
        
        <body>
            <header>
                <h1>Registration Form here...!</h1>
            </header>
            <main>
                <form>
                    <label for="fname">First name:</label><br>
                    <input type="text" id="fname" placeholder="enter you firstname" required><br><br>
                    <label for="lname">Last name:</label><br>
                    <input type="text" id="lname" placeholder="enter you lastname" required><br><br>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" placeholder="enter your email" required><br><br>
                    <label for="age">Age:</label><br>
                    <input type="text" id="age" placeholder="enter your age" required><br><br>
                    <label for="phone">Phone number:</label><br>
                    <input type="text" id="phone" placeholder="enter your phone number" patter="[0-9]{10}" required><br><br>
                    <label for="gender">Gender:</label><br>
                    <input type="radio" id="male" name="gender" value="male" required> Male
                    <input type="radio" id="female" name="gender" value="female" required> Female
                    <input type="radio" id="other" name="gender" value="other" required> Other<br><br>
                    <label for="employment">Employment Type:</label><br>
                    <select id="employment" required>
                        <option value="">Select</option>
                        <option value="fulltime">Full-time</option>
                        <option value="intern">Part-time</option>
                        <option value="unemployed">Unemployed</option>
                    </select><br><br>
                    <button type="submit">Register</button>
                    <br><br>
                    <button type="reset" value="Reset">Reset</button>

                    <table>
                    <thead>
                        <tr>
                            <th>S.no</th>
                            <th>First name</th>
                            <th>Last name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Phone number</th>
                            <th>Gender</th>
                            <th>Employment Type</th>
                        </tr>
                        
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Thabitha</td>
                            <td>P</td>
                            <td>thabitha@example.com</td>
                            <td>21</td>
                            <td>87698754638</td>
                            <td>Female</td>
                            <td>Intern</td>
                        </tr>
                    </tbody>
<br><br>
                    <tfoot>
                        The table contains registered candidates details
                    </tfoot>

                    </table>
                </form>
            </main>
        </body>
</html>
